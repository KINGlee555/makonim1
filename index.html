<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MaKonim - רשימת קניות משותפת</title>
    <meta name="description" content="MaKonim - רשימת קניות משותפת למשפחה. שתפו רשימה, קנו ביחד, עדכנו בזמן אמת." />
    <meta name="theme-color" content="#FFD400" />
    <meta name="robots" content="index, follow" />

    <!-- התקנה על מסך הבית והרצה כאפליקציה במובייל — תמיד במסך מלא -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MaKonim" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      // מסך מלא במובייל: אפליקציה שהותקנה על מסך הבית נפתחת כך מהמניפסט,
      // ובטאב דפדפן מבקשים מסך מלא בלחיצה הראשונה של המשתמש (הדפדפן מחייב מחווה).
      (function () {
        try {
          var el = document.documentElement;
          var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
          var alreadyFull =
            window.matchMedia("(display-mode: fullscreen)").matches ||
            Boolean(document.fullscreenElement || document.webkitFullscreenElement);
          // דפדפן שאין לו בכלל מסך מלא (למשל ספארי באייפון) פשוט נשאר כמו שהוא
          if (!isMobile || alreadyFull || window.self !== window.top) return;
          if (!(el.requestFullscreen || el.webkitRequestFullscreen)) return;

          var asked = false;
          function toFullscreen() {
            if (asked) return;
            asked = true;
            document.removeEventListener("touchend", toFullscreen, true);
            document.removeEventListener("click", toFullscreen, true);
            var request = el.requestFullscreen || el.webkitRequestFullscreen;
            if (!request) return;
            try {
              var result = request.call(el, { navigationUI: "hide" });
              if (result && result.catch) result.catch(function () {});
            } catch (error) {}
          }
          document.addEventListener("touchend", toFullscreen, true);
          document.addEventListener("click", toFullscreen, true);
        } catch (error) {}
      })();
    </script>

    <!-- שיתוף ברשתות -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MaKonim" />
    <meta property="og:title" content="MaKonim - רשימת קניות משותפת" />
    <meta property="og:description" content="רשימת קניות אחת לכל המשפחה, מתעדכנת בזמן אמת, עם מחירים ומבצעים מרשתות השיווק." />
    <meta property="og:image" content="https://media.base44.com/images/public/69cfa62de4216044e8c1f14e/067697bc9_logo.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/jpeg" href="https://media.base44.com/images/public/69cfa62de4216044e8c1f14e/2d1599b0e_IMG_0820.jpeg" />

  </body>
</html>
